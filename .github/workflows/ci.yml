# Compila y corre todas las pruebas, incluidas las de UI (TestFX necesita escritorio: runner de Windows).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    name: Pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn verify
        run: ./mvnw -B verify

      - name: Capturas de las pruebas de UI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: target/ui-snapshots/
          if-no-files-found: ignore
